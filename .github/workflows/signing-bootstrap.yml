name: Prepare encrypted signing key
on:
  pull_request:
    paths: ['.github/workflows/signing-bootstrap.yml', 'scripts/prepare-signing.py']
  workflow_dispatch:
    inputs:
      public_key:
        description: GitHub Actions repository public encryption key (not a secret)
        required: true
      key_id:
        description: ID of that public encryption key
        required: true
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - run: python3 -m pip install PyNaCl==1.5.0
      - name: Prepare candidate; never install or rotate a repository secret here
        env:
          SIGNING_PUBLIC_KEY: ${{ inputs.public_key }}
          SIGNING_PUBLIC_KEY_ID: ${{ inputs.key_id }}
        run: python3 scripts/prepare-signing.py
      - name: Inspect historical public APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for run in 43755139117 43759169992; do
            destination="$RUNNER_TEMP/legacy-$run"
            gh run download "$run" --name HyprDroid-debug-apk --dir "$destination"
            echo "Run $run" >> .local/signing-bootstrap/legacy-apks.txt
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$destination/app-debug.apk" | head -1 >> .local/signing-bootstrap/legacy-apks.txt
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$destination/app-debug.apk" >> .local/signing-bootstrap/legacy-apks.txt
          done
          cat .local/signing-bootstrap/legacy-apks.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Encrypted-signing-candidate
          path: .local/signing-bootstrap/
          if-no-files-found: error
          retention-days: 3
