name: External Lua experimental Android
on:
  push:
    branches: [feature/safe-external-lua-runtime, feature/lua-runtime-hardening, feature/plugin-api-v2]
  workflow_dispatch:
    inputs:
      sustained:
        description: Run the ten-minute Clock Tile scenario
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build test-only APKs
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:testExperimentalUnitTest :app:assembleExperimental :app:assembleExperimentalAndroidTest -PtestExperimental=true -Pv2FixtureLua=true
      - name: Verify APK identity, signature and native alignment
        run: |
          set -eu
          apk=app/build/outputs/apk/experimental/app-experimental.apk
          tools="$ANDROID_HOME/build-tools/34.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" > experimental-badging.txt
          grep -F "package: name='dev.hyprdroid.launcher.experimental'" experimental-badging.txt
          grep -F "application-label:'HyprDroid Experimental'" experimental-badging.txt
          grep -F "launchable-activity: name='dev.hyprdroid.launcher.MainActivity'" experimental-badging.txt
          grep -F "'arm64-v8a'" experimental-badging.txt
          grep -F "sdkVersion:'29'" experimental-badging.txt
          "$tools/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='dev.hyprdroid.launcher'"
          "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml > experimental-manifest.txt
          grep -F 'dev.hyprdroid.launcher.experimental.androidx-startup' experimental-manifest.txt
          grep -F 'dev.hyprdroid.launcher.experimental.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' experimental-manifest.txt
          if grep -F 'android.intent.category.HOME' experimental-manifest.txt; then exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
      - name: Enable emulator hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run native worker and Binder tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >-
            adb install app/build/outputs/apk/debug/app-debug.apk &&
            adb install app/build/outputs/apk/experimental/app-experimental.apk &&
            adb shell pm path dev.hyprdroid.launcher &&
            adb shell pm path dev.hyprdroid.launcher.experimental &&
            sh scripts/ci-home.sh select &&
            adb shell am start -W -n dev.hyprdroid.launcher.experimental/dev.hyprdroid.launcher.MainActivity &&
            ./gradlew :app:connectedExperimentalAndroidTest -PtestExperimental=true -Pv2FixtureLua=true -Pandroid.testInstrumentationRunnerArguments.class=dev.hyprdroid.launcher.external.ExternalLuaAndroidTest,dev.hyprdroid.launcher.external.ExternalTileLifecycleTest,dev.hyprdroid.launcher.external.ExternalLuaProtocolTest,dev.hyprdroid.launcher.external.ExternalV2WorkerTest &&
            adb install -r app/build/outputs/apk/experimental/app-experimental.apk &&
            adb install -r app/build/outputs/apk/androidTest/experimental/app-experimental-androidTest.apk &&
            adb logcat -d -s HyprLuaPressure > app/build/reports/androidTests/lua-pressure.txt &&
            grep -F 'native touchedMiB=' app/build/reports/androidTests/lua-pressure.txt &&
            grep -E 'worker PSS guard|native allocation failed' app/build/reports/androidTests/lua-pressure.txt &&
            sh scripts/ci-v2-persistence.sh dev.hyprdroid.launcher.experimental &&
            ./gradlew :app:connectedExperimentalAndroidTest -PtestExperimental=true -Pv2FixtureLua=true -Pandroid.testInstrumentationRunnerArguments.class=dev.hyprdroid.launcher.external.ExternalLuaLoadTest &&
            adb logcat -d -s HyprLuaLoad:I > app/build/reports/androidTests/lua-load.txt &&
            grep -F 'rounds=10 burst=6 completed=60' app/build/reports/androidTests/lua-load.txt &&
            if [ "${{ inputs.sustained }}" = true ]; then sh scripts/ci-lua-sustained.sh; fi
      - uses: actions/upload-artifact@v4
        with:
          name: hyprdroid-experimental-apk
          path: app/build/outputs/apk/experimental/app-experimental.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyprdroid-experimental-test-report
          path: |
            app/build/reports/androidTests/sustained/
            app/build/reports/androidTests/lua-pressure.txt
            app/build/reports/androidTests/lua-load.txt
            app/build/reports/androidTests/connected/
            app/build/reports/androidTests/v2-persistence/
          if-no-files-found: warn
