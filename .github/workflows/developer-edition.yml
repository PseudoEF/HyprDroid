name: Developer Edition isolation
on:
  push:
    branches: [feature/developer-edition]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate a signed fixture using SDK 0.1.1
        run: |
          set -eu
          sudo apt-get install -y lua5.4
          wheel=hyprdroid_sdk-0.1.1-py3-none-any.whl
          curl --fail --location --silent --show-error "https://github.com/PseudoEF/HyprDroid-SDK/releases/download/v0.1.1/$wheel" --output "$RUNNER_TEMP/$wheel"
          printf '%s  %s\n' 8228f6041467e3623da59b87823bdeff2a8a44be3f1fa919dd4ea435731296b5 "$RUNNER_TEMP/$wheel" | sha256sum -c -
          python3 -m venv "$RUNNER_TEMP/hyp-sdk"
          "$RUNNER_TEMP/hyp-sdk/bin/pip" install --no-index "$RUNNER_TEMP/$wheel"
          PATH="$RUNNER_TEMP/hyp-sdk/bin:$PATH" sh scripts/developer-sdk-fixture.sh "$RUNNER_TEMP/developer-sdk-fixture"
          echo "HYPR_DEVELOPER_SDK_FIXTURE=$RUNNER_TEMP/developer-sdk-fixture" >> "$GITHUB_ENV"
      - name: Build unit tests and APKs
        run: ./gradlew :app:testDebugUnitTest :app:testDeveloperUnitTest :app:assembleDebug :app:assembleDeveloper :app:assembleDebugAndroidTest
      - name: Check packaged identities, HOME and inclusion of Developer code
        run: sh scripts/check-edition-apks.sh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/developer/app-developer-unsigned.apk
      - name: Create an Android emulator test APK
        if: github.event_name != 'workflow_dispatch'
        run: |
          # This key and its APK stay within this test job. Distribution uses a distinct persistent key.
          keytool -genkeypair -alias hyprdroid-developer -keystore "$RUNNER_TEMP/emulator-only.p12" -storetype PKCS12 -storepass android -dname CN=DeveloperEmulatorTest -keyalg RSA -keysize 2048 -validity 2
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -f 4 app/build/outputs/apk/developer/app-developer-unsigned.apk "$RUNNER_TEMP/developer-aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/emulator-only.p12" --ks-pass pass:android --out "$RUNNER_TEMP/developer-test.apk" "$RUNNER_TEMP/developer-aligned.apk"
      - name: Build the Developer instrumentation APK with the emulator-only key
        if: github.event_name != 'workflow_dispatch'
        env:
          HYPRDROID_DEVELOPER_KEYSTORE_FILE: ${{ runner.temp }}/emulator-only.p12
          HYPRDROID_DEVELOPER_KEYSTORE_PASSWORD: android
        run: ./gradlew :app:assembleDeveloperAndroidTest -PtestDeveloper=true
      - name: Enable KVM
        if: github.event_name != 'workflow_dispatch'
        run: sudo chmod 666 /dev/kvm
      - name: Check parallel installation on Android 15
        if: github.event_name != 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: sh scripts/ci-developer-edition.sh && sh scripts/ci-developer-import.sh
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'workflow_dispatch'
        with:
          name: hyprdroid-developer-import-test-report
          path: app/build/reports/developer-import/
          if-no-files-found: warn

  signed-isolation-apk:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/developer-edition'
    needs: android
    permissions:
      contents: read
      actions: read
    environment: developer-signing
    concurrency:
      group: hyprdroid-developer-distribution
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch the signed Developer version 14 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45373875821 --name hyprdroid-developer-isolation-apk --dir "$RUNNER_TEMP/developer-baseline"
          cd "$RUNNER_TEMP/developer-baseline"
          sha256sum -c SHA256SUMS
          mv HyprDroid-Developer-isolation.apk "$RUNNER_TEMP/developer-previous.apk"
      - name: Build the successor APK
        run: |
          set -eu
          current=$((GITHUB_RUN_NUMBER * 2))
          test "$current" -gt 14
          ./gradlew :app:assembleDebug :app:assembleDeveloper :app:assembleDebugAndroidTest -PbuildVersionCode="$current"
          cp app/build/outputs/apk/developer/app-developer-unsigned.apk "$RUNNER_TEMP/developer-current-unsigned.apk"
      - name: Sign Developer APKs with the dedicated persistent certificate
        env:
          HYPRDROID_DEVELOPER_KEYSTORE_BASE64: ${{ secrets.HYPRDROID_DEVELOPER_KEYSTORE_BASE64 }}
          HYPRDROID_DEVELOPER_KEYSTORE_PASSWORD: ${{ secrets.HYPRDROID_DEVELOPER_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          umask 077
          : "${HYPRDROID_DEVELOPER_KEYSTORE_BASE64:?missing Developer APK signing keystore}"
          : "${HYPRDROID_DEVELOPER_KEYSTORE_PASSWORD:?missing Developer APK signing password}"
          key="$RUNNER_TEMP/developer-signing.p12"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$HYPRDROID_DEVELOPER_KEYSTORE_BASE64" | base64 --decode > "$key"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -f 4 "$RUNNER_TEMP/developer-current-unsigned.apk" "$RUNNER_TEMP/developer-current-aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias hyprdroid-developer --ks-pass env:HYPRDROID_DEVELOPER_KEYSTORE_PASSWORD --out "$RUNNER_TEMP/developer-current.apk" "$RUNNER_TEMP/developer-current-aligned.apk"
          for build in previous current; do
            "$tools/apksigner" verify --print-certs "$RUNNER_TEMP/developer-$build.apk" > "$RUNNER_TEMP/developer-$build-certs.txt"
            grep -Fx 'Signer #1 certificate SHA-256 digest: 5c30c0c6b00e6170775331db79585f667870092fea380110ac1434ece20a7bff' "$RUNNER_TEMP/developer-$build-certs.txt"
          done
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify Developer APK update on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DEVELOPER_INITIAL_APK: ${{ runner.temp }}/developer-previous.apk
          DEVELOPER_UPDATED_APK: ${{ runner.temp }}/developer-current.apk
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: sh scripts/ci-developer-edition.sh
      - name: Stage the verified Developer APK
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/developer-current.apk" dist/HyprDroid-Developer-isolation.apk
          cd dist
          sha256sum HyprDroid-Developer-isolation.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hyprdroid-developer-isolation-apk
          path: dist/
          if-no-files-found: error
