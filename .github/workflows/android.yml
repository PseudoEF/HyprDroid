name: Android debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      external_lua:
        description: Enable the pinned Hello Tile test in the main HyprDroid APK
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify code without distribution credentials
        run: |
          python3 scripts/test_versions.py
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      # PR builds are checks, never distributed with an ephemeral signing key.
  distribute:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
        (!inputs.external_lua || github.ref == 'refs/heads/feature/safe-external-lua-runtime' ||
          github.ref == 'refs/heads/feature/lua-runtime-hardening' ||
          github.ref == 'refs/heads/feature/plugin-api-v2' ||
          github.ref == 'refs/heads/feature/official-v2-packages' ||
          github.ref == 'refs/heads/feature/developer-edition'))
    needs: build
    permissions:
      actions: read
      contents: write # Reserve immutable ci/debug/<versionCode> tags; never modify main.
    concurrency:
      group: hyprdroid-debug-distribution
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HYPRDROID_DISTRIBUTION: 'true'
      HYPRDROID_BUILD_COMMIT: ${{ github.sha }}
      HYPRDROID_TEST_V2_OFFICIAL: ${{ (inputs.external_lua && (github.ref == 'refs/heads/feature/official-v2-packages' || github.ref == 'refs/heads/feature/developer-edition')) && 'true' || 'false' }}
      HYPRDROID_TEST_OFFICIAL_UPGRADE: ${{ (inputs.external_lua && github.ref == 'refs/heads/feature/developer-edition') && 'true' || 'false' }}
      HYPRDROID_TEST_V2_FIXTURES: ${{ (inputs.external_lua && github.ref == 'refs/heads/feature/plugin-api-v2') && 'true' || 'false' }}
      HYPRDROID_TEST_EXTERNAL_LUA: ${{ inputs.external_lua && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native toolchain for the opt-in build
        if: inputs.external_lua
        run: sdkmanager 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Restore persistent signing key; fail closed
        env:
          HYPRDROID_KEYSTORE_BASE64: ${{ secrets.HYPRDROID_KEYSTORE_BASE64 }}
          HYPRDROID_KEYSTORE_PASSWORD: ${{ secrets.HYPRDROID_KEYSTORE_PASSWORD }}
        run: python3 scripts/restore-signing.py
      - name: Reserve two global monotonic version codes
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/reserve-version-codes.py
      - name: Fetch the signed 10185 upgrade baseline
        if: env.HYPRDROID_TEST_V2_OFFICIAL == 'true' && env.HYPRDROID_TEST_OFFICIAL_UPGRADE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45328873979 --name HyprDroid-debug-10185-run45328873979-attempt1 --dir .local/upgrade-10185
      - name: Fetch the signed 10199 upgrade baseline
        if: env.HYPRDROID_TEST_OFFICIAL_UPGRADE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45395548914 --name HyprDroid-debug-10199-run45395548914-attempt1 --dir .local/upgrade-10199
      - name: Check out the actual v0.9.0 baseline for in-place upgrade
        if: env.HYPRDROID_TEST_V2_OFFICIAL != 'true'
        uses: actions/checkout@v4
        with:
          ref: b9ac974cd333b9ae59caea409424ff7e7fda0140
          path: .local/upgrade-baseline
          persist-credentials: false
      - name: Build sequential APKs and verify provenance
        env:
          CODE_A: ${{ steps.versions.outputs.first }}
          CODE_B: ${{ steps.versions.outputs.second }}
          HYPRDROID_KEYSTORE_PASSWORD: ${{ secrets.HYPRDROID_KEYSTORE_PASSWORD }}
        run: sh scripts/build-distribution.sh
      - name: Remove temporary private key before emulator and artifact steps
        if: always()
        run: rm -f "$RUNNER_TEMP/hyprdroid-signing.p12"
      - name: Enable emulator hardware acceleration on CI host
        run: sudo chmod 666 /dev/kvm
      - name: Verify in-place update on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CODE_A: ${{ steps.versions.outputs.first }}
          CODE_B: ${{ steps.versions.outputs.second }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh scripts/ci-upgrade.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HyprDroid-debug-${{ steps.versions.outputs.second }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/hyprdroid-distribution/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HyprDroid-update-report-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: .local/upgrade-report/
          if-no-files-found: warn
          retention-days: 14
