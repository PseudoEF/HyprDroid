name: Android shell UI
on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'scripts/ci-shell-ui.sh'
      - '.github/workflows/shell-ui.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: UI suite (pull requests always run all tests)
        type: choice
        options: [all, wallpaper, quicksettings, topbar, interaction]
        default: all
      api_level:
        description: Android API (37 = Android 17, gesture navigation)
        type: choice
        options: ['35', '37']
        default: '35'
permissions:
  contents: read
jobs:
  shell-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HYPRDROID_UI_SUITE: ${{ inputs.suite || 'all' }}
      HYPRDROID_TEST_API: ${{ inputs.api_level || '35' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator hardware acceleration on CI host
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          # Compile with the pinned SDK35; Android17 images use the minor-version package name.
          api-level: 35
          system-image-api-level: ${{ inputs.api_level == '37' && '37.0' || '35' }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh scripts/ci-shell-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HyprDroid-shell-ui
          path: |
            .local/shell-ui/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
